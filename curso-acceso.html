<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Malevo Academia · Tu acceso</title>
<link rel="icon" href="/assets/malevo-logo-real.png">
<!-- Open Graph: al compartir este link por WhatsApp, la app arma una
     tarjeta de vista previa (imagen+título+descripción) leyendo estas
     etiquetas — así el mensaje se ve prolijo aunque la URL cruda quede
     visible arriba del todo (eso lo decide WhatsApp, no se puede evitar). -->
<meta property="og:title" content="Malevo Academia · Tu acceso al curso">
<meta property="og:description" content="Tocá para desbloquear tu curso — enlace de un solo uso.">
<meta property="og:image" content="/assets/malevo-logo-real.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --card-bg:#161616; --card-border:#2A2A2A;
    --text:#FFFFFF; --text-2:#A0A0A0; --muted:#707070;
    --gold:#E29023; --gold-2:#FFD573; --warn:#e05c5c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
    min-height:100dvh;overflow-x:hidden;-webkit-text-size-adjust:100%;}
  h1,h2,h3{font-family:'Sora',sans-serif;margin:0;}
  #app{max-width:480px;margin:0 auto;padding:28px 18px 60px;min-height:100dvh;display:flex;flex-direction:column;}
  .cx-header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:26px;}
  .cx-header img{width:64px;height:64px;object-fit:contain;border-radius:14px;}
  .cx-header .marca{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
  .cx-titulo{font-size:20px;font-weight:800;color:var(--gold-2);}
  .cx-sub{font-size:13px;color:var(--text-2);text-align:center;line-height:1.6;margin-top:4px;}
  .cx-estado{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:40vh;text-align:center;gap:14px;}
  .cx-estado .ico{font-size:44px;}
  .cx-estado p{color:var(--text-2);font-size:14.5px;line-height:1.6;max-width:420px;}
  .cx-form{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:20px;margin-top:8px;}
  .cx-form label{display:block;font-size:12.5px;color:var(--text-2);margin:0 0 6px;}
  .cx-form input{width:100%;padding:12px 14px;border-radius:9px;border:1px solid var(--card-border);
    background:#0f0f0f;color:var(--text);font-size:15px;margin-bottom:16px;font-family:inherit;}
  .cx-form input:focus{outline:none;border-color:var(--gold);}
  .cx-form button{width:100%;padding:13px;border:none;border-radius:9px;background:var(--gold);color:#1a1200;
    font-weight:700;font-size:15px;cursor:pointer;font-family:'Sora',sans-serif;}
  .cx-form button:disabled{opacity:.6;cursor:default;}
  .cx-error{color:var(--warn);font-size:13px;margin-top:10px;text-align:center;min-height:16px;}
  .cx-footer{text-align:center;margin-top:24px;color:var(--muted);font-size:11.5px;line-height:1.7;}
  .cx-footer a{color:var(--gold-2);text-decoration:none;}
</style>
</head>
<body>
<div id="app">
  <div class="cx-header">
    <img src="/assets/malevo-logo-real.png" alt="Malevo Academia" onerror="this.style.display='none'">
    <div class="marca">Malevo Academia</div>
    <div class="cx-titulo" id="cxTitulo">Tu acceso al curso</div>
  </div>

  <div id="cxContenido">
    <div class="cx-estado">
      <div class="ico">⏳</div>
      <p>Comprobando tu enlace…</p>
    </div>
  </div>

  <div class="cx-footer">¿Problemas para entrar? Escribinos y te ayudamos —
    <a href="https://wa.me/" target="_blank">contactar por WhatsApp</a>.</div>
</div>

<script>
function $(id){ return document.getElementById(id); }

function qs(name){
  return new URLSearchParams(location.search).get(name) || '';
}

// El parámetro "nombre" viene de la URL (controlable por quien la arme a
// mano) y se inserta en la página vía innerHTML más abajo — escaparlo
// evita que un link manipulado pueda inyectar HTML/JS en esta pantalla.
function esc(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function estadoHtml(icono, mensaje){
  return '<div class="cx-estado"><div class="ico">'+icono+'</div><p>'+mensaje+'</p></div>';
}

function formHtml(nombreCurso){
  var intro = nombreCurso
    ? 'Completá tus datos para desbloquear <strong>'+nombreCurso+'</strong>. Este enlace es de un solo uso: una vez '
    : 'Completá tus datos para desbloquear tu curso. Este enlace es de un solo uso: una vez ';
  return '<div class="cx-sub">'+intro+
    'que confirmes, quedará vinculado a vos.</div>'+
    '<div class="cx-form">'+
      '<label for="cxNombre">Tu nombre</label>'+
      '<input type="text" id="cxNombre" autocomplete="name" placeholder="Nombre y apellido">'+
      '<label for="cxTelefono">Tu teléfono</label>'+
      '<input type="tel" id="cxTelefono" autocomplete="tel" placeholder="Ej: 600111222">'+
      '<button id="cxBtnConfirmar" onclick="confirmarAcceso(window._cxToken)">Confirmar y ver mi curso</button>'+
      '<div class="cx-error" id="cxErrorForm"></div>'+
    '</div>';
}

// Pantalla para quien YA tiene una sesión activa (ver iniciar(): detectada
// vía /api/me) — no hace falta pedirle nombre/teléfono de nuevo, solo
// confirmar que sume este curso a su cuenta ya existente.
function formYaLogueadoHtml(nombreCurso, nombreAlumno){
  var quien = nombreAlumno ? ', '+esc(nombreAlumno) : '';
  var curso = nombreCurso ? '<strong>'+nombreCurso+'</strong>' : 'este curso';
  return '<div class="cx-sub">¡Hola'+quien+'! Ya tenés tu cuenta de Malevo Academia — solo falta sumar '+curso+' a tu app.</div>'+
    '<div class="cx-form">'+
      '<button id="cxBtnConfirmar" onclick="confirmarAccesoAuto(window._cxToken)">Sumar curso a mi cuenta</button>'+
      '<div class="cx-error" id="cxErrorForm"></div>'+
    '</div>';
}

// Tramo compartido tras un canjear exitoso (con o sin formulario previo):
// muestra el OK y manda al portal directo a Cursos Exclusivos.
function _cxCanjeOk(data){
  $('cxContenido').innerHTML = estadoHtml('✅', '¡Listo, '+(data.nombre||'')+'! Te llevamos a tu curso…');
  // "?curso=desbloqueado" le indica a portal.js que debe abrir directo en
  // Cursos Exclusivos (en vez de Inicio) para que el alumno vea de
  // inmediato lo que acaba de desbloquear. Ver arrancarPortal() en portal.js.
  setTimeout(function(){ location.href = '/portal.html?curso=desbloqueado'; }, 1200);
}

// El link corto solo trae "t" (el token) — ni el id del curso ni su nombre
// viajan en la URL, así se mantiene corto para WhatsApp. Todo lo demás se
// resuelve consultando al servidor por ese token.
async function confirmarAcceso(token){
  var nombre = ($('cxNombre').value || '').trim();
  var telefono = ($('cxTelefono').value || '').trim();
  var errBox = $('cxErrorForm');
  errBox.textContent = '';
  if (!nombre){ errBox.textContent = 'Falta tu nombre.'; return; }
  if (!telefono){ errBox.textContent = 'Falta tu teléfono.'; return; }
  var btn = $('cxBtnConfirmar');
  btn.disabled = true; btn.textContent = 'Confirmando…';
  try{
    var r = await fetch('/api/publico/token/'+encodeURIComponent(token)+'/canjear', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ nombre: nombre, telefono: telefono })
    });
    var data = await r.json();
    if (!r.ok || !data.ok){
      errBox.textContent = data.error || 'No pudimos validar tu enlace.';
      btn.disabled = false; btn.textContent = 'Confirmar y ver mi curso';
      return;
    }
    _cxCanjeOk(data);
  }catch(e){
    errBox.textContent = 'No pudimos confirmar tu acceso ahora mismo. Probá de nuevo en un momento.';
    btn.disabled = false; btn.textContent = 'Confirmar y ver mi curso';
  }
}

// Variante para quien YA tiene sesión (ver formYaLogueadoHtml/iniciar): no
// manda nombre/teléfono en el body — el servidor identifica al comprador
// por la cookie de sesión y solo agrega el curso a esa cuenta existente.
async function confirmarAccesoAuto(token){
  var errBox = $('cxErrorForm');
  if (errBox) errBox.textContent = '';
  var btn = $('cxBtnConfirmar');
  if (btn){ btn.disabled = true; btn.textContent = 'Sumando curso…'; }
  try{
    var r = await fetch('/api/publico/token/'+encodeURIComponent(token)+'/canjear', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({})
    });
    var data = await r.json();
    if (!r.ok || !data.ok){
      if (errBox) errBox.textContent = data.error || 'No pudimos validar tu enlace.';
      if (btn){ btn.disabled = false; btn.textContent = 'Sumar curso a mi cuenta'; }
      return;
    }
    _cxCanjeOk(data);
  }catch(e){
    if (errBox) errBox.textContent = 'No pudimos confirmar tu acceso ahora mismo. Probá de nuevo en un momento.';
    if (btn){ btn.disabled = false; btn.textContent = 'Sumar curso a mi cuenta'; }
  }
}

async function iniciar(){
  var token = qs('t');
  var cont = $('cxContenido');
  if (!token){
    cont.innerHTML = estadoHtml('🔒', 'Este enlace está incompleto. Pedile a la academia que te reenvíe tu acceso.');
    return;
  }
  // Consulta al servidor apenas carga la página: así el visitante ve de
  // inmediato si el link ya no sirve (usado/inválido) en vez de recién
  // enterarse después de completar todo el formulario.
  try{
    var r = await fetch('/api/publico/token/'+encodeURIComponent(token));
    var data = await r.json();
    if (!r.ok || !data.ok){
      cont.innerHTML = estadoHtml('🔒', esc(data.error || 'Este enlace no es válido.'));
      return;
    }
    var nombreCurso = esc(data.cursoNombre || '');
    if (nombreCurso) $('cxTitulo').textContent = 'Tu acceso a ' + nombreCurso;
    window._cxToken = token; // usado por el onclick del botón, ver formHtml()/formYaLogueadoHtml()

    // ¿Ya tiene una sesión activa? (p.ej. abrió este link nuevo desde la PWA
    // que ya tiene instalada de un curso anterior) — si es así, no tiene
    // sentido pedirle nombre/teléfono otra vez: el servidor va a identificar
    // al comprador por la cookie y solo sumarle el curso nuevo.
    var nombreAlumno = '';
    try{
      var rMe = await fetch('/api/me', { cache:'no-store', credentials:'same-origin' });
      if (rMe.ok){
        var me = await rMe.json();
        nombreAlumno = me.nombre || '';
      }
    }catch(e){ /* sin sesión o sin red — seguimos con el formulario normal */ }

    cont.innerHTML = nombreAlumno ? formYaLogueadoHtml(nombreCurso, nombreAlumno) : formHtml(nombreCurso);
  }catch(e){
    cont.innerHTML = estadoHtml('⚠️', 'No pudimos comprobar tu enlace ahora mismo. Probá de nuevo en un momento.');
  }
}
iniciar();
</script>
</body>
</html>
